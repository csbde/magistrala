server:
  mqtt:
    tcp:
      v3:
        addr: "0.0.0.0:1883"
        protocol: "v3"
        max_connections: 10000
        read_timeout: 60s
        write_timeout: 60s
      v5:
        addr: "0.0.0.0:1884"
        protocol: "v5"
        max_connections: 10000
        read_timeout: 60s
        write_timeout: 60s
    websocket:
      v3:
        addr: "0.0.0.0:8083"
        path: "/mqtt"
        protocol: "v3"
      v5:
        addr: "0.0.0.0:8084"
        path: "/mqtt"
        protocol: "v5"
  admin_api_addr: "0.0.0.0:8082"
  health_addr: "0.0.0.0:8081"
  health_enabled: true

storage:
  type: "badger"
  badger_dir: "/tmp/fluxmq/data"

log:
  level: "info"
  format: "text"

cluster:
  enabled: false
  node_id: "broker-1"

# Webhook configuration for Magistrala device authentication, ACL, and message synchronization
hooks:
  url: "http://127.0.0.1:8080/hooks"
  transport: "http"
  timeout: 1000ms
  fail_mode: "allow"
  protocols:
    mqtt: true
    http: true
    coap: true
  events:
    auth_on_publish: true
    auth_on_subscribe: true
    auth_on_unsubscribe: true
