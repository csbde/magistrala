name: Release Single Binary

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Single Binary (Linux AMD64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Build Frontend UI
        run: |
          cd ui
          npm ci
          npm run build
          mkdir -p ../cmd/server/dist
          cp -r dist/* ../cmd/server/dist/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build Embedded Single Binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p build
          go build -ldflags "-s -w -X 'main.Version=${{ github.ref_name }}'" -o build/magistrala-server cmd/server/main.go

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/magistrala-server
          draft: false
          prerelease: false
          generate_release_notes: true
